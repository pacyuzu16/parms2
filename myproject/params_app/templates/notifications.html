{% extends "userin.html" %}
{% load static %}

{% block content %}
<style>
    .notif-card { background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;max-width:720px; }
    .notif-hdr { padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px; }
    .notif-hdr h5 { font-size:0.9rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;margin:0; }
    .notif-row { display:flex;align-items:flex-start;gap:14px;padding:14px 20px;border-bottom:1px solid var(--border);transition:background 0.1s;cursor:pointer; }
    .notif-row:last-child { border-bottom:none; }
    .notif-row:hover { background:var(--bg); }
    .notif-row.unread { background:#f0fdf4;border-left:3px solid var(--green); }
    .notif-icon { width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.9rem;flex-shrink:0; }
    .ni-green { background:#dcfce7;color:#166534; }
    .ni-blue  { background:#dbeafe;color:#1e40af; }
    .ni-amber { background:#fef9c3;color:#854d0e; }
    .ni-red   { background:#fee2e2;color:#b91c1c; }
    .notif-body { flex:1;min-width:0; }
    .notif-title  { font-size:0.875rem;font-weight:600;color:var(--text);margin-bottom:2px; }
    .notif-detail { font-size:0.8rem;color:var(--muted); }
    .notif-time   { font-size:0.75rem;color:#94a3b8;white-space:nowrap;margin-top:1px; }
    .unread-dot { width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;margin-top:5px; }
    .notif-empty { text-align:center;padding:48px 20px;color:var(--muted); }
    .notif-empty i { font-size:2.5rem;opacity:0.2;display:block;margin-bottom:12px; }
    .mark-all-btn { padding:6px 13px;background:transparent;border:1.5px solid var(--border);border-radius:6px;font-size:0.78rem;font-weight:600;color:var(--muted);cursor:pointer;transition:border-color 150ms; }
    .mark-all-btn:hover { border-color:var(--green);color:var(--green); }
</style>

<div style="max-width:720px;">
    <div class="notif-card">
        <div class="notif-hdr">
            <h5>
                <i class="fas fa-bell" style="color:var(--green);"></i>
                Notifications
                <span id="unread-badge" style="font-size:0.72rem;background:var(--green);color:white;padding:2px 7px;border-radius:20px;font-weight:700;display:none;"></span>
            </h5>
            <div style="display:flex;gap:8px;align-items:center;">
                <span style="font-size:0.78rem;color:var(--muted);" id="notif-count">Loading...</span>
                <button class="mark-all-btn" id="markAllBtn" onclick="markAllRead()" style="display:none;">
                    Mark all read
                </button>
            </div>
        </div>
        <div id="notif-list">
            <div style="text-align:center;padding:32px;color:var(--muted);">
                <i class="fas fa-spinner fa-spin" style="font-size:1.5rem;margin-bottom:8px;display:block;opacity:0.4;"></i>
                <p style="font-size:0.84rem;margin:0;">Loading notifications...</p>
            </div>
        </div>
    </div>
</div>

<script>
const ICON_MAP = {
    'space_available': ['sign-in-alt', 'ni-green'],
    'nearly_full':     ['exclamation-triangle', 'ni-amber'],
    'expiry_warning':  ['clock', 'ni-amber'],
    'session_ended':   ['check-circle', 'ni-blue'],
    'system':          ['info-circle', 'ni-blue'],
    'entry':           ['sign-in-alt', 'ni-green'],
    'exit':            ['check-circle', 'ni-blue'],
};

function loadNotifications() {
    fetch('/api/notifications/data/')
        .then(r => r.json())
        .then(function(resp) {
            if (!resp.success) return;
            const list = document.getElementById('notif-list');
            const badge = document.getElementById('unread-badge');
            const count = document.getElementById('notif-count');
            const markBtn = document.getElementById('markAllBtn');

            count.textContent = resp.notifications.length + ' notifications';
            if (resp.unread > 0) {
                badge.textContent = resp.unread + ' new';
                badge.style.display = 'inline-block';
                markBtn.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
                markBtn.style.display = 'none';
            }

            if (resp.notifications.length === 0) {
                list.innerHTML = '<div class="notif-empty">'
                    + '<i class="fas fa-bell"></i>'
                    + '<p style="font-size:0.875rem;margin:0;">No activity yet.<br>Start a parking session to see notifications here.</p>'
                    + '<a href="/slots/" style="display:inline-block;margin-top:16px;padding:8px 18px;background:var(--green);color:white;border-radius:8px;font-size:0.84rem;font-weight:600;text-decoration:none;">Find a Parking Slot</a>'
                    + '</div>';
                return;
            }

            list.innerHTML = resp.notifications.map(function(n) {
                const iconData = ICON_MAP[n.type] || ['bell', 'ni-blue'];
                const ico = iconData[0], cls = iconData[1];
                const unreadDot = !n.is_read ? '<div class="unread-dot"></div>' : '';
                return '<div class="notif-row ' + (n.is_read ? '' : 'unread') + '" onclick="markRead(' + n.id + ', this)">'
                    + '<div class="notif-icon ' + cls + '"><i class="fas fa-' + ico + '"></i></div>'
                    + '<div class="notif-body">'
                    + '<div class="notif-title">' + n.title + '</div>'
                    + '<div class="notif-detail">' + n.message + '</div>'
                    + '</div>'
                    + '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">'
                    + '<div class="notif-time">' + n.time_ago + '</div>'
                    + unreadDot
                    + '</div>'
                    + '</div>';
            }).join('');
        })
        .catch(function() {
            document.getElementById('notif-count').textContent = 'Could not load';
        });
}

function markRead(id, el) {
    el.classList.remove('unread');
    const dot = el.querySelector('.unread-dot');
    if (dot) dot.remove();
    fetch('/api/notifications/' + id + '/read/', { method: 'POST', headers: { 'X-CSRFToken': getCsrf() } });
}

function markAllRead() {
    fetch('/api/notifications/mark-all-read/', { method: 'POST', headers: { 'X-CSRFToken': getCsrf() } })
        .then(function() { loadNotifications(); });
}

function getCsrf() {
    const m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? m[1] : '';
}

loadNotifications();
setInterval(loadNotifications, 30000);
</script>
{% endblock %}
