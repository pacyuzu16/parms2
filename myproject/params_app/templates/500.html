<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error — PARMS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Inter',sans-serif;background:#f7f8f7;color:#161b19;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px;}
        .wrap{text-align:center;max-width:480px;}
        .code{font-family:'Plus Jakarta Sans',sans-serif;font-size:6rem;font-weight:800;color:#161b19;letter-spacing:-0.05em;line-height:1;margin-bottom:8px;}
        .code span{color:#c5e8d5;}
        h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.5rem;font-weight:800;color:#161b19;margin-bottom:12px;letter-spacing:-0.02em;}
        p{font-size:0.9375rem;color:#4f5a55;line-height:1.7;margin-bottom:32px;}
        .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
        a.primary{padding:10px 24px;background:#c5e8d5;color:white;border:1px solid #9dd4b8;border-radius:6px;font-size:0.9rem;font-weight:600;text-decoration:none;}
        a.primary:hover{background:#9dd4b8;}
        a.ghost{padding:10px 24px;background:transparent;color:#4f5a55;border:1.5px solid #dde3e0;border-radius:6px;font-size:0.9rem;font-weight:500;text-decoration:none;}
        a.ghost:hover{border-color:#b8cfc8;}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="code">5<span>0</span>0</div>
        <h1>Something went wrong</h1>
        <p>
            An unexpected error occurred on our end. Our team has been notified.
            Please try again in a moment.
        </p>
        <div class="actions">
            <a href="/" class="primary"><i class="fas fa-home"></i> Back to Home</a>
            <a href="javascript:location.reload()" class="ghost">Try Again</a>
        </div>
    </div>
</body>
</html>
