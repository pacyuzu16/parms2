{% extends "index.html" %}
{% load static %}

{% block content %}
<style>
    .err-page{min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;background:var(--parchment);padding:48px 24px;}
    .err-inner{text-align:center;max-width:480px;}
    .err-code{font-family:'Plus Jakarta Sans',sans-serif;font-size:6rem;font-weight:800;color:var(--ink);letter-spacing:-0.05em;line-height:1;margin-bottom:8px;}
    .err-code span{color:var(--forest);}
    .err-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.5rem;font-weight:800;color:var(--ink);margin-bottom:12px;letter-spacing:-0.02em;}
    .err-body{font-size:0.9375rem;color:var(--steel);line-height:1.7;margin-bottom:32px;}
    .err-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
    .err-btn-primary{padding:10px 24px;background:var(--forest);color:white;border:1px solid var(--forest-dark);border-radius:var(--radius-sm);font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:600;text-decoration:none;transition:background 150ms;}
    .err-btn-primary:hover{background:var(--forest-dark);color:white;}
    .err-btn-ghost{padding:10px 24px;background:transparent;color:var(--steel);border:1.5px solid var(--dust);border-radius:var(--radius-sm);font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:500;text-decoration:none;transition:border-color 150ms;}
    .err-btn-ghost:hover{border-color:var(--sage-mid);color:var(--ink);}
</style>

<div class="err-page">
    <div class="err-inner">
        <div class="err-code">4<span>0</span>4</div>
        <h1 class="err-title">Page not found</h1>
        <p class="err-body">
            The page you were looking for doesn't exist or may have been moved.
            Let's get you back on track.
        </p>
        <div class="err-actions">
            <a href="/" class="err-btn-primary"><i class="fas fa-home"></i> Back to Home</a>
            <a href="javascript:history.back()" class="err-btn-ghost">Go Back</a>
        </div>
    </div>
</div>
{% endblock %}
