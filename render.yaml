databases:
  - name: parms-db
    databaseName: parms_db
    user: parms_user
    plan: free

services:
  - type: web
    name: parms
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "cd myproject && gunicorn myproject.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: false

      # Update this to match your actual Render service URL after first deploy
      - key: ALLOWED_HOSTS
        value: parms.onrender.com

      # Update this to match your actual Render service URL after first deploy
      - key: CSRF_TRUSTED_ORIGINS
        value: https://parms.onrender.com

      # Render automatically injects DATABASE_URL from the linked database above.
      # Do NOT hardcode a password here — use the fromDatabase link instead.
      - key: DATABASE_URL
        fromDatabase:
          name: parms-db
          property: connectionString
